<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>eightbit-bro · Live</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<main>
  <div class="panel" id="restart" hidden style="margin-bottom:14px;border-color:var(--warn)"></div>
  <div class="panel" id="deploy" hidden style="margin-bottom:14px"></div>
  <div class="cols">
    <div>
      <div class="panel">
        <div class="muted small">Console state</div>
        <div class="state" id="path">…</div>
        <div class="muted small">for <span id="since"></span> · source <code id="source"></code></div>
      </div>
      <div class="row" style="justify-content:space-between">
        <h2>Preview <label class="small" style="display:inline;margin-left:8px"><input type="checkbox" id="pv" checked style="width:auto"> live (1 fps)</label></h2>
        <div class="row"><span class="err small" id="captureerr"></span><button id="capture">📸 Capture frame for review</button></div>
      </div>
      <img class="frame" id="preview" alt="no frame yet">
    </div>
    <div>
      <h2 style="margin-top:0">Health</h2>
      <div class="panel"><table id="health"></table></div>
      <h2>Review queue</h2>
      <div class="panel"><a href="/review" id="review"></a></div>
      <h2>Recent events</h2>
      <div class="panel" id="events"></div>
    </div>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
nav("/");
let since = Date.now();
let seen = null;
const $ = (id) => document.getElementById(id);

function setState(path, s) { $("path").textContent = path; since = s; }
function addEvent(e, top) {
  const div = document.createElement("div");
  div.className = "ev";
  div.innerHTML = `<span class="muted small">${when(e.ts)} · #${e.frame_no}</span><br>${describe(e.kind)}`;
  top ? $("events").prepend(div) : $("events").append(div);
  while ($("events").children.length > 15) $("events").lastChild.remove();
}

async function refresh() {
  const s = await api("/state");
  setState(s.path, s.since);
  $("source").textContent = s.source;
  const r = s.rates, c = s.counters;
  const rows = [
    ["Capture", `${r.capture_fps.toFixed(0)} fps`],
    ["Perception", `${r.perceive_fps.toFixed(0)} fps · ${r.perceive_ms.toFixed(1)} ms/frame`],
    ["Frames", `${c.captured} captured · ${c.processed} perceived · ${c.skipped} skipped`],
    ["Corrupt / capture errors", `${c.corrupt} / ${c.capture_errors}`],
    ["CPU temperature", r.temp_c != null ? `${r.temp_c.toFixed(1)} °C` : "–"],
    ["Load", r.load ?? "–"],
    ["Memory (RSS)", r.rss_mb != null ? `${r.rss_mb.toFixed(0)} MB` : "–"],
    ["Running since", `${when(s.started)} (${ago(s.started)})`],
    ["Version", `${s.version} · build ${s.build}`],
  ];
  if (seen && (seen.started !== s.started || seen.build !== s.build)) {
    $("restart").textContent = seen.build !== s.build
      ? `Updated: new build ${s.build} started ${when(s.started)}.`
      : `Restarted at ${when(s.started)}.`;
    $("restart").hidden = false;
  }
  seen = { started: s.started, build: s.build };
  $("health").innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
  $("review").textContent = `${s.review.items} / ${s.review.max} unknown screens` +
    (s.review.skipped ? ` · ${s.review.skipped} skipped (queue full)` : "");
}

async function loadEvents() {
  const { events } = await api("/events?limit=15");
  $("events").innerHTML = "";
  events.forEach((e) => addEvent(e, false));
  if (!events.length) $("events").innerHTML = `<div class="muted">No events yet.</div>`;
}

$("capture").onclick = async () => {
  $("capture").disabled = true;
  $("captureerr").textContent = "";
  try {
    const { id } = await api("/capture", { json: {} });
    location.href = `/review/${id}`;
  } catch (e) {
    $("captureerr").textContent = e.message;
    $("capture").disabled = false;
  }
};

function tickPreview() {
  if ($("pv").checked && !document.hidden) $("preview").src = `/api/preview.jpg?t=${Date.now()}`;
}

function duration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

async function loadDeploy() {
  const { deploy: d, now } = await api("/deploy");
  const el = $("deploy");
  if (!d) { el.hidden = true; return; }
  el.hidden = false;
  const what = `<code>${esc(d.commit)}</code>${d.dirty ? " (uncommitted changes)" : ""} · ${esc(d.subject)}`;
  if (!d.finished) {
    const pct = d.total ? Math.min(100, Math.round(100 * d.compiled / d.total)) : null;
    const stale = now - d.updated > 30000 ? ` · <span style="color:var(--warn)">no update for ${duration(now - d.updated)}</span>` : "";
    el.style.borderColor = "var(--accent)";
    el.innerHTML = `<b>${d.kind === "dev" ? "Dev push" : "Deploying"}</b> ${what}<br>
      <span class="small">${esc(d.phase)}${d.phase === "building" ? ` · ${d.compiled}${d.total ? ` / ~${d.total}` : ""} crates` : ""}
      · ${duration(now - d.started)} elapsed${stale}</span>
      <div class="bar"><div style="width:${d.phase === "activating" || d.phase === "copying to the Pi" ? 100 : pct ?? 5}%"></div></div>
      <div class="muted small"><code>${esc(d.last_line)}</code></div>`;
  } else {
    const ok = d.result === "ok";
    el.style.borderColor = ok ? "var(--line)" : "var(--bad)";
    el.innerHTML = `<span class="small">Last ${d.kind === "dev" ? "dev push" : "deploy"} ${ok ? "✓" : `<b style="color:var(--bad)">${esc(d.result)}</b>`}: ${what}
      · ${when(d.finished)} · took ${duration(d.finished - d.started)} · by ${esc(d.by)}</span>
      ${ok ? "" : `<div class="muted small"><code>${esc(d.last_line)}</code></div>`}`;
  }
}

stream({
  state: (p) => setState(p.path, p.since),
  event: (e) => { if ($("events").querySelector(".muted:only-child")) $("events").innerHTML = ""; addEvent(e, true); },
  review: () => refresh(),
});
refresh(); loadEvents(); tickPreview(); loadDeploy();
setInterval(() => loadDeploy().catch(() => {}), 2000);
setInterval(refresh, 2000);
setInterval(tickPreview, 1000);
setInterval(() => { $("since").textContent = ago(since); }, 500);
</script>
</body></html>
