<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>eightbit-bro · Log in</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<div class="center panel">
  <h1>👾 eightbit-bro</h1>
  <form id="f">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required>
    <div class="row" style="margin-top:14px"><button class="primary" type="submit">Log in</button></div>
    <div class="err" id="err"></div>
  </form>
</div>
<script src="/static/app.js"></script>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/login", { json: { password: document.getElementById("password").value } });
    location.href = "/";
  } catch (err) {
    if (err.message === "setup required") return;
    document.getElementById("err").textContent = err.message;
  }
};
</script>
</body></html>
