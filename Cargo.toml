[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bro-heart = { path = "crates/bro-heart" }
bro-vision = { path = "crates/bro-vision" }
bro-games = { path = "crates/bro-games" }
bro-capture = { path = "crates/bro-capture" }
bro-record = { path = "crates/bro-record" }
bro-store = { path = "crates/bro-store" }
bro-web = { path = "crates/bro-web" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
